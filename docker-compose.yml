version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: gdg-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: gdg-eventhub
    volumes:
      - mongodb_data:/data/db
    networks:
      - gdg-network

  redis:
    image: redis:7-alpine
    container_name: gdg-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - gdg-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gdg-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/gdg-eventhub
      - REDIS_URI=redis://redis:6379
      - JWT_SECRET=gdg_rbu_production_secret_key_2026
      - JWT_EXPIRE=7d
      - NODE_ENV=production
    depends_on:
      - mongodb
      - redis
    networks:
      - gdg-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gdg-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - gdg-network

networks:
  gdg-network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
